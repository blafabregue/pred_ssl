framework: vicreg
# VICReg's loss is on the UN-normalized expander outputs (coeffs x25), so plain SGD
# at lr 0.3 diverges to NaN in a few steps. Use LARS + LR warmup + the paper's small
# weight decay (1e-6), matching the official VICReg recipe.
optimizer: lars
lr: 0.2                         # VICReg base-lr (x batch/256); LARS makes it robust
lr_scale_by_batch: true
lr_schedule: cosine
warmup_epochs: 10
weight_decay: 1.0e-6
# Expander. The canonical recipe is 3 layers x 8192 (output 8192), tuned for batch 2048.
# VICReg's covariance term estimates a DxD matrix from N samples, so what matters is the
# ratio D/N (D = expander OUTPUT): the paper runs 8192/2048 = 4, whereas 8192/256 = 32
# leaves the term dominated by estimation noise (measured: 64 of pure noise for the pair
# vs 8 at the official ratio -- about 60% of the loss at init, and VICReg then plateaus
# ~9 points below SimCLR).
#
# Key point: the covariance term only sees the OUTPUT dim, so hidden width and output
# dim can be set independently. proj_dim=1024 restores D/N = 4 (noise back to the
# official level) while expander_dim=2048 keeps a wide hidden layer: 10.5M params, on
# par with BYOL's projector (11.5M), rather than the 4.2M a uniform 1024 would give.
# If you change batch_size, rescale vicreg_proj_dim with it (tests/test_optim.py
# guards the ratio); expander_dim is free to grow, it only costs memory.
vicreg_expander_layers: 3
vicreg_expander_dim: 2048
vicreg_proj_dim: 1024
# Loss term weights (paper defaults).
vicreg_sim_coeff: 25.0
vicreg_std_coeff: 25.0
vicreg_cov_coeff: 1.0

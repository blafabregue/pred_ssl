# AugSelf baseline (Lee et al., NeurIPS 2021) — the closest prior method, run under
# our exact protocol so the comparison against relpred is apples-to-apples.
#
# Faithful to the paper: STANDARD independent two-view augmentation (same distribution
# as `baseline`, so the delta isolates the auxiliary loss), per-augmentation 3-layer
# MLPs regressing omega1 - omega2 under an l2 loss, predicted set
# A_AugSelf = {crop, color} (4 + 4 normalized parameters), and lambda = 0.5 — which is
# the value the paper itself uses for ImageNet-100, and coincidentally ours too.
# Their reported setup (IN-100, ResNet-50, 500 epochs, batch 256) matches ours exactly.
augself: true
rel_lambda: 0.5
aug_sharing: false        # AugSelf does NOT share augmentation parameters across views

# AugSelf's l2 regression head is numerically fragile at the learning rates used by
# SimCLR/BYOL/VICReg (0.2-0.3). Its published evaluation uses MoCo v2 and SimSiam
# (lr 0.03-0.05), where it is stable; at lr 0.3 it diverges to NaN within ~6
# iterations, because an MSE target does not saturate -- a drifting output produces a
# proportionally larger gradient, which makes it drift further. (Our relational head
# uses BCE-with-logits, which saturates, and needs no such safeguard.)
#
# Gradient clipping stabilizes it without altering the objective. The threshold is
# chosen to be non-binding in normal operation: healthy SimCLR training has a median
# gradient norm of 1.9, so 10 leaves ordinary steps untouched while preventing the
# explosive feedback. Verified: no clip -> NaN; clip 100 -> still diverging (loss
# 1220); clip 10 -> stable (loss 2.83).
grad_clip: 10.0
